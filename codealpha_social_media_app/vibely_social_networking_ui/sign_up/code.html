<style>
        body {
            background-color: #f8f9fc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .step-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hidden-step {
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none;
            position: absolute;
        }
        .active-step {
            opacity: 1;
            transform: translateX(0);
            position: relative;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile py-6 bg-white/30 backdrop-blur-md">
<div class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight text-primary">
            Vibely
        </div>
<button class="text-primary font-label-md hover:opacity-80 transition-opacity">
            Sign In
        </button>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-24 pb-12">
<div class="w-full max-w-md">
<div class="mb-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2" id="form-title">Create Account</h1>
<p class="font-body-md text-on-surface-variant" id="form-subtitle">Join a community of modern creators.</p>
</div>
<form class="space-y-6 relative overflow-hidden" id="signup-form">
<div class="step-transition active-step space-y-5" id="step-1">
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant ml-1">Full Name</label>
<input class="w-full px-5 py-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary-container transition-all outline-none text-body-md placeholder:text-outline-variant" name="fullname" placeholder="Enter your full name" required="" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant ml-1">Email Address</label>
<input class="w-full px-5 py-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary-container transition-all outline-none text-body-md placeholder:text-outline-variant" name="email" placeholder="hello@example.com" required="" type="email"/>
</div>
<button class="w-full py-4 bg-primary-container text-on-primary-container rounded-2xl font-headline-sm flex items-center justify-center gap-2 shadow-[0px_4px_20px_rgba(91,75,255,0.15)] active:scale-95 transition-all" onclick="nextStep(2)" type="button">
                        Continue
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<div class="step-transition hidden-step space-y-5 w-full" id="step-2">
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant ml-1">Username</label>
<div class="relative">
<span class="absolute left-5 top-1/2 -translate-y-1/2 text-outline-variant font-body-md">@</span>
<input class="w-full pl-10 pr-5 py-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary-container transition-all outline-none text-body-md placeholder:text-outline-variant" name="username" placeholder="vibely_user" required="" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-on-surface-variant ml-1">Password</label>
<div class="relative">
<input class="w-full px-5 py-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary-container transition-all outline-none text-body-md placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 pt-2">
<div class="flex items-center h-6">
<input class="h-5 w-5 rounded-md border-outline-variant text-primary focus:ring-primary-container bg-surface-container-low transition-all" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-label-sm text-on-surface-variant leading-5 cursor-pointer" for="terms">
                            I agree to the <span class="text-primary font-bold">Terms of Service</span> and <span class="text-primary font-bold">Privacy Policy</span>.
                        </label>
</div>
<div class="flex gap-3">
<button class="w-20 py-4 bg-surface-container-high text-on-surface rounded-2xl font-headline-sm flex items-center justify-center active:scale-95 transition-all" onclick="nextStep(1)" type="button">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<button class="flex-grow py-4 bg-primary-container text-on-primary-container rounded-2xl font-headline-sm shadow-[0px_4px_20px_rgba(91,75,255,0.25)] active:scale-95 transition-all" type="submit">
                            Get Started
                        </button>
</div>
</div>
</form>
<div class="mt-12 flex flex-col items-center gap-6">
<div class="flex items-center gap-4 w-full">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label-sm text-outline uppercase tracking-widest">or sign up with</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 py-4 glass-panel border border-white/50 rounded-2xl flex items-center justify-center shadow-sm active:scale-95 transition-all">
<img alt="Google Logo" class="w-6 h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSji5P3ciG16kZVSvA4mt3ogMTmevLS1iQZx423zMS_3ReHMKDwRm96tRXmYYbSL6DV5kfp_HhfhCEnIp1KXTCqgCdHFCqjWbi9-XM3_OZZC4wiHHNfcyCfwSea8Wwm5mA-NTNiT1Bkmhc3oavgwYN2jN3Ih0Hn5idLI5Itajne4QDS9xusjh1WHv7SVB-UPA_MAyf0M9nUTytijEM9aa4CYuogc6fDZwsdIZF0p8ucfiRx4XOSt2Q5hbt0sHPreNMVgP0RhX-bfhZ"/>
</button>
<button class="flex-1 py-4 glass-panel border border-white/50 rounded-2xl flex items-center justify-center shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface" data-weight="fill">file_download</span>
</button>
</div>
</div>
</div>
</main>
<footer class="mt-auto py-8 text-center px-margin-mobile">
<p class="font-label-sm text-outline-variant">© 2026 Vibely Social Corp. All rights reserved.</p>
</footer>
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute -bottom-[5%] -right-[5%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<script>
        function nextStep(step) {
            const s1 = document.getElementById('step-1');
            const s2 = document.getElementById('step-2');
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');

            if (step === 2) {
                s1.classList.remove('active-step');
                s1.classList.add('hidden-step');
                s2.classList.remove('hidden-step');
                s2.classList.add('active-step');
                title.innerText = 'Almost There';
                subtitle.innerText = 'Choose your identity in the vibe.';
            } else {
                s2.classList.remove('active-step');
                s2.classList.add('hidden-step');
                s1.classList.remove('hidden-step');
                s1.classList.add('active-step');
                title.innerText = 'Create Account';
                subtitle.innerText = 'Join a community of modern creators.';
            }
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('pass-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            setTimeout(() => {
                alert('Account requested! In a real app, you would be redirected.');
                btn.disabled = false;
                btn.innerText = originalText;
            }, 1500);
        });
    </script>
</body></html>
