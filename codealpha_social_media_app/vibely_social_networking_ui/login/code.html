<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Ambient Background Elements -->
<div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none">
<div class="floating-blob bg-primary-container w-[300px] h-[300px] -top-20 -left-20"></div>
<div class="floating-blob bg-secondary-container w-[250px] h-[250px] bottom-1/4 -right-10" style="animation-delay: -5s;"></div>
<div class="floating-blob bg-primary w-[200px] h-[200px] top-1/2 -left-10" style="animation-delay: -10s;"></div>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<header class="mb-12 text-center animate-fade-in">
<h1 class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight text-primary">
                Vibely
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                Sophisticated Social Networking
            </p>
</header>
<!-- Login Form Card -->
<section class="w-full glass-bg rounded-[32px] p-8 shadow-[0px_8px_30px_rgba(0,0,0,0.04)] border border-white/40">
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface px-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                            mail
                        </span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-input text-body-md font-body-md transition-all duration-200 placeholder:text-outline/50" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:opacity-80 transition-opacity" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                            lock
                        </span>
<input class="w-full h-[56px] pl-12 pr-4 bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-input text-body-md font-body-md transition-all duration-200 placeholder:text-outline/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-[56px] bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-button shadow-lg shadow-primary/20 active:scale-[0.98] transition-all duration-200 mt-4 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="px-4 font-label-sm text-label-sm text-outline uppercase tracking-wider">or continue with</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Login Options -->
<div class="flex justify-center gap-6">
<button aria-label="Sign in with Apple" class="w-14 h-14 rounded-full border border-outline-variant/30 flex items-center justify-center hover:bg-white transition-colors active:scale-90">

<!-- Success Message (Hidden by default) -->
<div class="fixed inset-0 z-[100] bg-white flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500" id="successOverlay">
<div class="text-center space-y-6">
<div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mx-auto scale-0 transition-transform duration-500" id="successIcon">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary">Welcome back</h2>
<p class="font-body-lg text-body-lg text-outline">Loading your exclusive feed...</p>
</div>
</div>
<script>
        // Form Handling Logic
        const loginForm = document.getElementById('loginForm');
        const successOverlay = document.getElementById('successOverlay');
        const successIcon = document.getElementById('successIcon');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Visual Feedback
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalContent = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            // Mock delay for authentication
            setTimeout(() => {
                successOverlay.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    successIcon.classList.remove('scale-0');
                    successIcon.classList.add('scale-100');
                }, 100);
                
                // Redirect mock
                setTimeout(() => {
                    // window.location.href = '/dashboard';
                    alert('Authenticated! Navigating to dashboard...');
                    location.reload();
                }, 2500);
            }, 1200);
        });

        // Add focus effect to card on input focus
        const inputs = document.querySelectorAll('input');
        const card = document.querySelector('.glass-bg');
        
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                card.style.boxShadow = '0px 12px 40px rgba(91, 75, 255, 0.08)';
                card.style.borderColor = 'rgba(91, 75, 255, 0.1)';
            });
            input.addEventListener('blur', () => {
                card.style.boxShadow = '0px 8px 30px rgba(0,0,0,0.04)';
                card.style.borderColor = 'rgba(255, 255, 255, 0.4)';
            });
        });

        // Fade-in animation helper
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.animate-fade-in').forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body></html>
