<script>
        // Simple micro-interaction for list items
        document.querySelectorAll('.item-active-state').forEach(button => {
            button.addEventListener('click', () => {
                // Future implementation: navigation or sheet opening
                console.log('Navigating to: ' + button.innerText.trim());
            });
        });

        // Soft reveal animation on scroll
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-4');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.space-y-6 > div').forEach(div => {
            div.classList.add('transition-all', 'duration-700', 'ease-out', 'opacity-0', 'translate-y-4');
            observer.observe(div);
        });
    </script>
